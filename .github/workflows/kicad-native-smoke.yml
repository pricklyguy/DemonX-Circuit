name: KiCad native smoke (10.0.7)

on:
  push:
    branches:
      - codex/demonx-circuit-foundation
    paths:
      - ".github/workflows/kicad-native-smoke.yml"
      - "prototype/native-smoke/**"
      - "prototype/native-reference/**"
      - "examples/native-smoke/**"
      - "examples/esp32-sensor/**"
      - "examples/libraries/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    env:
      KICAD_IMAGE: ghcr.io/kicad/kicad:10.0.7-amd64-full@sha256:58fbffc63250320eadc80a4dd47833f64dfc1c9f0b5c63f7ea6c3055e2b0ca74
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up isolated FreeRouting runtime (Java 25)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify isolated image and Python bindings
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HOME=/tmp/kicad-smoke-home \
            "$KICAD_IMAGE" bash -lc '
              set -euo pipefail
              mkdir -p "$HOME" /tmp/native-smoke-python
              kicad-cli version
              python3 --version
              python3 -c "import pcbnew; print(\"pcbnew:\", pcbnew.GetBuildVersion())"
              test -d /usr/share/kicad/symbols
              test -d /usr/share/kicad/footprints
              test -f /usr/share/kicad/template/sym-lib-table
              test -f /usr/share/kicad/template/fp-lib-table
              export KICAD10_SYMBOL_DIR=/usr/share/kicad/symbols
              export KICAD10_FOOTPRINT_DIR=/usr/share/kicad/footprints
              echo "=== User-owned native library export/delete/reimport/reuse proof ==="
              python3 prototype/native-reference/library_roundtrip.py
              python3 prototype/native-smoke/inspect_symbols.py
              mkdir -p "$HOME/.config/kicad/10.0"
              cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
              cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"

              # Bootstrap pinned pip into /tmp only; the CLI image omits pip.
              python3 prototype/native-smoke/bootstrap_pip.py
              export PYTHONPATH=/tmp/pip-bootstrap
              python3 -m pip --version
              python3 -m pip install --disable-pip-version-check --no-compile \
                --retries 5 --timeout 30 \
                --target /tmp/native-smoke-python \
                -r prototype/native-smoke/requirements.txt
              NATIVE_SMOKE_PYTHONPATH=/tmp/native-smoke-python \
              KICAD_SYMBOL_DIR=/usr/share/kicad/symbols \
              KICAD_FOOTPRINT_DIR=/usr/share/kicad/footprints \
                bash prototype/native-smoke/run.sh

              echo "=== ESP32-S3/BME280/relay native schematic prototype ==="
              export PYTHONPATH=/tmp/native-smoke-python:/tmp/pip-bootstrap
              export KICAD_SYMBOL_DIR=/usr/share/kicad/symbols
              export KICAD_FOOTPRINT_DIR=/usr/share/kicad/footprints
              python3 prototype/native-reference/generate_schematic.py
              mkdir -p reports/native-reference
              kicad-cli sch export netlist --format kicadxml \
                --output reports/native-reference/DX_ESP32_Sensor.net \
                examples/esp32-sensor/native/DX_ESP32_Sensor.kicad_sch
              python3 prototype/native-reference/verify_netlist.py \
                reports/native-reference/DX_ESP32_Sensor.net \
                reports/native-reference/verified-netlist.json
              if kicad-cli sch erc --severity-all --exit-code-violations \
                --output reports/native-reference/erc.rpt \
                examples/esp32-sensor/native/DX_ESP32_Sensor.kicad_sch; then
                reference_erc_status=0
              else
                reference_erc_status=$?
              fi
              cat reports/native-reference/erc.rpt
              if [[ "$reference_erc_status" -ne 0 ]]; then
                echo "FAIL: Native ESP32 schematic ERC reported violations (exit $reference_erc_status)." >&2
                exit "$reference_erc_status"
              fi
              kicad-cli sch upgrade --force \
                examples/esp32-sensor/native/DX_ESP32_Sensor.kicad_sch
              if kicad-cli sch erc --severity-all --exit-code-violations \
                --output reports/native-reference/erc-reopened.rpt \
                examples/esp32-sensor/native/DX_ESP32_Sensor.kicad_sch; then
                reference_erc_reopened_status=0
              else
                reference_erc_reopened_status=$?
              fi
              cat reports/native-reference/erc-reopened.rpt
              if [[ "$reference_erc_reopened_status" -ne 0 ]]; then
                echo "FAIL: Reopened ESP32 schematic ERC reported violations (exit $reference_erc_reopened_status)." >&2
                exit "$reference_erc_reopened_status"
              fi
              python3 prototype/native-reference/generate_board.py reports/native-reference/DX_ESP32_Sensor.net
              echo "PASS: Native ESP32 reference schematic generated, netlisted, ERC-checked, and reopened."
            '

      - name: Run pinned FreeRouting on KiCad Specctra DSN
        run: |
          set -euo pipefail
          mkdir -p reports/native-reference/layout "$RUNNER_TEMP/freerouting-data"
          jar="$RUNNER_TEMP/freerouting-2.5.0.jar"
          curl --fail --location --retry 3 \
            https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar \
            --output "$jar"
          echo "f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7  $jar" | sha256sum --check
          java -version
          java -jar "$jar" \
            -de reports/native-reference/layout/DX_ESP32_Sensor.dsn \
            -do reports/native-reference/layout/DX_ESP32_Sensor.ses \
            -mp 8 -mt 1 -da --gui.enabled=false \
            --router.copperToEdgeClearanceUm=500 \
            --user_data_path="$RUNNER_TEMP/freerouting-data" \
            2>&1 | tee reports/native-reference/layout/freerouting.log
          test -s reports/native-reference/layout/DX_ESP32_Sensor.ses
          sha256sum "$jar" reports/native-reference/layout/DX_ESP32_Sensor.dsn reports/native-reference/layout/DX_ESP32_Sensor.ses

      - name: Import routed SES and perform native DRC, reopen and exports
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HOME=/tmp/kicad-reference-final-home \
            "$KICAD_IMAGE" bash -lc '
              set -euo pipefail
              mkdir -p "$HOME" reports/native-reference/layout/gerbers reports/native-reference/layout/drill reports/native-reference/layout/step
              board=examples/esp32-sensor/native/DX_ESP32_Sensor.kicad_pcb
              ses=reports/native-reference/layout/DX_ESP32_Sensor.ses
              python3 prototype/native-reference/import_session.py "$board" "$ses"
              version="$(kicad-cli version)"
              echo "$version"
              [[ "$version" == *"10.0.7"* ]]
              if kicad-cli pcb drc --severity-all --exit-code-violations --output reports/native-reference/layout/drc-initial.rpt "$board"; then drc_status=0; else drc_status=$?; fi
              cat reports/native-reference/layout/drc-initial.rpt
              if [[ "$drc_status" -ne 0 ]]; then echo "FAIL: Fixture DRC reported violations; exports withheld." >&2; exit "$drc_status"; fi
              kicad-cli pcb upgrade --force "$board"
              if kicad-cli pcb drc --severity-all --exit-code-violations --output reports/native-reference/layout/drc-reopened.rpt "$board"; then reopened_status=0; else reopened_status=$?; fi
              cat reports/native-reference/layout/drc-reopened.rpt
              if [[ "$reopened_status" -ne 0 ]]; then echo "FAIL: Reopened fixture DRC reported violations." >&2; exit "$reopened_status"; fi
              kicad-cli pcb export gerbers --board-plot-params --layers F.Cu,B.Cu,F.Mask,B.Mask,F.Silkscreen,Edge.Cuts --output reports/native-reference/layout/gerbers/ "$board"
              kicad-cli pcb export drill --format excellon --excellon-units mm --drill-origin absolute --output reports/native-reference/layout/drill/ "$board"
              kicad-cli pcb export step --output reports/native-reference/layout/step/DX_ESP32_Sensor-assembly.step "$board"
              echo "=== Fixture export inventory ==="
              find reports/native-reference/layout -type f -printf "%P\t%s bytes\n" | sort
              test -s reports/native-reference/layout/drc-initial.rpt
              test -s reports/native-reference/layout/drc-reopened.rpt
              test -s reports/native-reference/layout/step/DX_ESP32_Sensor-assembly.step
              find reports/native-reference/layout/gerbers -type f -name '*.gbr' -print -quit | grep -q .
              find reports/native-reference/layout/drill -type f -print -quit | grep -q .
              echo "PASS: KiCad 10.0.7 imported the routed SES, DRC passed before and after reopen, and fixture Gerber/Excellon/assembly STEP files were generated."
            '

      - name: Generate ESPHome YAML from native verified nets
        run: |
          set -euo pipefail
          node --version
          node prototype/generate-esphome.mjs \
            examples/esp32-sensor/native/DX_ESP32_Sensor.esphome.yaml \
            --verified-netlist reports/native-reference/verified-netlist.json
          api_validation_key="$(openssl rand -base64 32)"
          cat > examples/esp32-sensor/native/secrets.yaml <<EOF
          wifi_ssid: "validation-placeholder"
          wifi_password: "validation-placeholder"
          api_encryption_key: "${api_validation_key}"
          ota_password: "validation-placeholder"
          fallback_ap_password: "validation-placeholder"
          EOF
          unset api_validation_key
          echo "ESPHome image: ghcr.io/esphome/esphome:2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145" \
            | tee reports/native-reference/esphome-validation.txt

      - name: Validate generated YAML with official ESPHome CLI
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/examples/esp32-sensor/native:/config" \
            -w /config \
            -e HOME=/tmp/esphome-native-validation-home \
            --entrypoint /bin/sh \
            ghcr.io/esphome/esphome:2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145 \
            -lc 'mkdir -p "$HOME" && esphome version && esphome config DX_ESP32_Sensor.esphome.yaml' \
            2>&1 | tee -a reports/native-reference/esphome-validation.txt

      - name: Remove schema-validation secrets
        if: always()
        run: rm -f examples/esp32-sensor/native/secrets.yaml

      - name: Save KiCad reports and manufacturing files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kicad-native-smoke-10.0.7
          path: |
            reports/native-smoke/
            reports/native-reference/
            examples/native-smoke/DX_LED_Smoke/
            examples/esp32-sensor/native/
          if-no-files-found: warn
          retention-days: 30
