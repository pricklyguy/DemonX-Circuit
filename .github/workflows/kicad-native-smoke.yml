name: KiCad native smoke (10.0.7)

on:
  push:
    branches:
      - codex/demonx-circuit-foundation
    paths:
      - ".github/workflows/kicad-native-smoke.yml"
      - "prototype/native-smoke/**"
      - "examples/native-smoke/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kicad/kicad:10.0.7-amd64-full@sha256:58fbffc63250320eadc80a4dd47833f64dfc1c9f0b5c63f7ea6c3055e2b0ca74
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify isolated image and Python bindings
        run: |
          kicad-cli version
          python3 --version
          python3 -c 'import pcbnew; print("pcbnew:", pcbnew.GetBuildVersion())'
          test -d /usr/share/kicad/symbols
          test -d /usr/share/kicad/footprints

      - name: Install schematic generator into a temporary package target
        run: |
          python3 -m pip install --disable-pip-version-check --no-compile \
            --target "$RUNNER_TEMP/native-smoke-python" \
            -r prototype/native-smoke/requirements.txt
          echo "NATIVE_SMOKE_PYTHONPATH=$RUNNER_TEMP/native-smoke-python" >> "$GITHUB_ENV"
          echo "KICAD_SYMBOL_DIR=/usr/share/kicad/symbols" >> "$GITHUB_ENV"
          echo "KICAD_FOOTPRINT_DIR=/usr/share/kicad/footprints" >> "$GITHUB_ENV"

      - name: Generate, check, export, and reopen the native fixture
        run: bash prototype/native-smoke/run.sh

      - name: Save KiCad reports and manufacturing files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kicad-native-smoke-10.0.7
          path: |
            reports/native-smoke/
            examples/native-smoke/DX_LED_Smoke/
          if-no-files-found: warn
          retention-days: 30
