name: DemonX Circuit Windows development preview

on:
  push:
    branches: [codex/demonx-circuit-foundation, codex/demonx-circuit-schematic-editor]
    paths:
      - ".github/workflows/desktop-preview.yml"
      - "desktop/**"
      - "desktop/assets/**"
      - "assets/DemonX_wordmarks/DemonX Circuit.png"
      - "assets/DemonX_Icons/DemonX_Circuit/DemonX_Glowing_Board.ico"
      - "assets/DemonX_Icons/DemonX_Circuit/DemonX_Glowing_Board_256.png"
      - "assets/DemonX_Icons/DemonX_Circuit/DemonX_Glowing_Board_512.png"
      - "package.json"
      - "package-lock.json"
      - "prototype/**"
      - "examples/native-smoke/led-resistor.dxcircuit.json"
      - "examples/esp32-sensor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-validation:
    uses: ./.github/workflows/kicad-native-smoke.yml

  windows-preview:
    needs: native-validation
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out approved feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked project-local dependencies
        run: npm ci --no-fund

      - name: Audit locked dependencies
        shell: pwsh
        run: |
          npm audit --audit-level=high --json | Tee-Object -FilePath build-npm-audit.json | Out-Null
          $auditExit = $LASTEXITCODE
          if ($auditExit -ne 0) { exit $auditExit }

      - name: Build the desktop renderer
        run: npm run build

      - name: Download the verified native starter from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kicad-native-smoke-10.0.7
          path: build/native-fixture

      - name: Test the DemonX schematic semantic model
        run: npm run test:schematic-model

      - name: Test constrained native schematic import and export
        env:
          DEMONX_NATIVE_SMOKE_FIXTURE: ${{ github.workspace }}/build/native-fixture/examples/native-smoke/DX_LED_Smoke
        run: npm run test:native-roundtrip

      - name: Test the official MCP SDK read-only server
        env:
          DEMONX_NATIVE_SMOKE_FIXTURE: ${{ github.workspace }}/build/native-fixture/examples/native-smoke/DX_LED_Smoke
        run: npm run test:mcp

      - name: Provision KiCad 10.0.7 on the disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'kicad-10.0.7-x86_64.exe'
          Invoke-WebRequest -Uri 'https://github.com/KiCad/kicad-source-mirror/releases/download/10.0.7/kicad-10.0.7-x86_64.exe' -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'ce3881b6a9188eb34ac1ebaaec7651149e8a025206410addfb11a1a9656ecf95'
          if ($actual -ne $expected) { throw "KiCad installer checksum mismatch: $actual" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'KiCad Services Corporation') { throw "KiCad installer Authenticode verification failed: $($signature.Status); $($signature.SignerCertificate.Subject)" }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/allusers' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -notin @(0, 3010, 1641)) { throw "KiCad installer failed with exit code $($process.ExitCode)" }
          $cli = Join-Path $env:ProgramFiles 'KiCad\10.0\bin\kicad-cli.exe'
          if (-not (Test-Path -LiteralPath $cli)) { throw 'Pinned installer completed but kicad-cli.exe was not found.' }
          $version = & $cli version
          Write-Output "KiCad CLI: $version"
          if ($version -ne '10.0.7') { throw "Expected KiCad CLI 10.0.7, detected $version" }

      - name: Set up isolated ESPHome validation CLI
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Install ESPHome 2026.10.0 for packaged YAML acceptance
        run: |
          python -m pip install --disable-pip-version-check esphome==2026.10.0
          esphome version

      - name: Assemble the portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path (Get-Location).Path 'build/windows-preview/DemonX-Circuit'
          $appRoot = Join-Path $bundle 'resources/app'
          New-Item -ItemType Directory -Force $appRoot | Out-Null
          Copy-Item 'node_modules/electron/dist/*' $bundle -Recurse -Force
          Copy-Item 'node_modules/electron/dist/electron.exe' (Join-Path $bundle 'DemonX Circuit.exe') -Force
          Copy-Item package.json $appRoot -Force
          New-Item -ItemType Directory -Force "$appRoot/desktop/dist" | Out-Null
          New-Item -ItemType Directory -Force "$appRoot/desktop" | Out-Null
          Copy-Item desktop/main.cjs "$appRoot/desktop/main.cjs" -Force
          Copy-Item desktop/kicad-schematic-adapter.cjs "$appRoot/desktop/kicad-schematic-adapter.cjs" -Force
          Copy-Item desktop/index.html,desktop/style.css "$appRoot/desktop/" -Force
          Copy-Item desktop/dist/* "$appRoot/desktop/dist/" -Recurse -Force
          Copy-Item desktop/assets "$appRoot/desktop/assets" -Recurse -Force
          New-Item -ItemType Directory -Force "$appRoot/prototype" | Out-Null
          Copy-Item 'prototype/generate-esphome.mjs' "$appRoot/prototype/generate-esphome.mjs" -Force
          Copy-Item examples "$appRoot/examples" -Recurse -Force
          $starter = Join-Path (Get-Location).Path 'build/native-fixture/examples/native-smoke/DX_LED_Smoke'
          if (-not (Test-Path -LiteralPath (Join-Path $starter 'DX_LED_Smoke.kicad_sch'))) { throw 'Verified KiCad LED starter schematic is missing.' }
          New-Item -ItemType Directory -Force "$appRoot/examples/native-smoke/DX_LED_Smoke" | Out-Null
          Copy-Item "$starter/*" "$appRoot/examples/native-smoke/DX_LED_Smoke/" -Recurse -Force
          $espNative = Join-Path (Get-Location).Path 'build/native-fixture/examples/esp32-sensor/native'
          if (-not (Test-Path -LiteralPath (Join-Path $espNative 'DX_ESP32_Sensor.kicad_pcb'))) { throw 'Verified ESP32 reference board is missing from the KiCad workflow artifact.' }
          New-Item -ItemType Directory -Force "$appRoot/examples/esp32-sensor/native" | Out-Null
          Copy-Item "$espNative/*" "$appRoot/examples/esp32-sensor/native/" -Recurse -Force
          $verifiedNetlist = Join-Path (Get-Location).Path 'build/native-fixture/reports/native-reference/verified-netlist.json'
          if (-not (Test-Path -LiteralPath $verifiedNetlist)) { throw 'Verified native KiCad pin mapping report is missing.' }
          Copy-Item $verifiedNetlist "$appRoot/examples/esp32-sensor/native/verified-netlist.json" -Force
          @'
          DemonX Circuit development preview 0.5.0

          Launch with "DemonX Circuit.exe". This is a portable development preview; it does not install tools or modify PATH/registry.
          KiCad 10.0.7 must be installed separately for opening and checking native designs. ESPHome CLI is optional for YAML compatibility validation.
          New Project creates an editable LED/resistor starter project from native files generated and checked by KiCad 10.0.7. The packaged ESP32 fixture includes the matching verified KiCad netlist for the YAML preview.
          AI/MCP, Forge, and CNC handoffs are not implemented in this preview.
          '@ | Set-Content "$bundle/README.txt" -Encoding utf8
          node prototype/verify-windows-package.mjs "$bundle" (Resolve-Path 'node_modules/electron/dist').Path | Tee-Object build-package-integrity.json
          $integrityExit = $LASTEXITCODE
          if ($integrityExit -ne 0) { exit $integrityExit }

      - name: Create deterministic portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "build/DemonX-Circuit-Windows-Preview-$version.zip"
          ./prototype/create-portable-zip.ps1 -SourceDirectory 'build/windows-preview/DemonX-Circuit' -Destination $zip
          Write-Output "PortableZip=$zip"

      - name: Scan the extracted distribution with Microsoft Defender
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'build/windows-preview/DemonX-Circuit') {
            ./prototype/scan-windows-preview.ps1 -ScanPath 'build/windows-preview/DemonX-Circuit' -ReportPath 'build/security/defender-scan.json'
          } else {
            New-Item -ItemType Directory -Force build/security | Out-Null
            '{"status":"NOT TESTED","reason":"Package assembly did not produce an extracted distribution."}' | Set-Content build/security/defender-scan.json -Encoding utf8
          }

      - name: Write release manifest and SHA-256 files
        if: success()
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "build/DemonX-Circuit-Windows-Preview-$version.zip"
          node prototype/write-release-manifest.mjs 'build/windows-preview/DemonX-Circuit' $zip "build/DemonX-Circuit-Windows-Preview-$version.release-manifest.json" "build/DemonX-Circuit-Windows-Preview-$version.sha256sums.txt" $env:GITHUB_SHA $version

      - name: Run packaged Windows acceptance against the extracted ZIP
        if: success()
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "build/DemonX-Circuit-Windows-Preview-$version.zip"
          $extracted = Join-Path (Get-Location).Path 'build/windows-e2e'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted -Force
          $exeCandidates = @(Get-ChildItem -LiteralPath $extracted -Filter 'DemonX Circuit.exe' -File -Recurse)
          if ($exeCandidates.Count -ne 1) { throw "Expected one packaged executable, found $($exeCandidates.Count)." }
          node desktop/acceptance.mjs $exeCandidates[0].FullName (Join-Path $env:RUNNER_TEMP 'desktop-acceptance')

      - name: Determine whether provenance attestation is safe to create
        id: provenance_gate
        if: always()
        shell: pwsh
        run: |
          $eligible = $false
          $reason = 'Package, integrity report, release manifest, or clean Defender result is missing.'
          $zip = Get-ChildItem -LiteralPath build -Filter 'DemonX-Circuit-Windows-Preview-*.zip' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $releaseManifest = Get-ChildItem -LiteralPath build -Filter 'DemonX-Circuit-Windows-Preview-*.release-manifest.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip -and $releaseManifest -and (Test-Path 'build-package-integrity.json') -and (Test-Path 'build/security/defender-scan.json')) {
            $integrity = Get-Content 'build-package-integrity.json' -Raw | ConvertFrom-Json
            $defender = Get-Content 'build/security/defender-scan.json' -Raw | ConvertFrom-Json
            if ($integrity.status -eq 'PASS' -and $defender.status -eq 'PASS') { $eligible = $true; $reason = 'Package integrity passed and Microsoft Defender reported no threats; provenance is independent of GUI acceptance.' }
          }
          "eligible=$($eligible.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Attestation eligible=$eligible; $reason"

      - name: Attest the portable ZIP provenance
        id: provenance
        continue-on-error: true
        if: always() && steps.provenance_gate.outputs.eligible == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/DemonX-Circuit-Windows-Preview-*.zip

      - name: Record provenance attestation result
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/security | Out-Null
          $status = if ('${{ steps.provenance.outcome }}' -eq 'success') { 'PASS' } elseif ('${{ steps.provenance_gate.outputs.eligible }}' -ne 'true') { 'NOT ATTESTED' } else { 'INCONCLUSIVE' }
          $reason = if ($status -eq 'PASS') { 'GitHub actions/attest created an artifact provenance attestation. GUI acceptance status is reported separately.' } elseif ($status -eq 'NOT ATTESTED') { '${{ steps.provenance_gate.outputs.reason }}' } else { 'Attestation was eligible but unavailable or rejected by repository visibility/permissions; see workflow logs.' }
          @{ status = $status; action = 'actions/attest@v4.2.2'; subject = 'portable Windows ZIP'; reason = $reason } | ConvertTo-Json | Set-Content build/security/provenance-status.json -Encoding utf8

      - name: Upload Windows development preview and security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demonx-circuit-windows-development-preview
          path: |
            build/DemonX-Circuit-Windows-Preview-*.zip
            build/DemonX-Circuit-Windows-Preview-*.release-manifest.json
            build/DemonX-Circuit-Windows-Preview-*.sha256sums.txt
            build/DemonX-Circuit-Windows-Preview-*.zip.sha256
            build/DemonX-Circuit-Windows-Preview-*.exe.sha256
            build-package-integrity.json
            build-npm-audit.json
            build/security/defender-scan.json
            build/native-fixture/reports/native-smoke/**
            build/native-fixture/reports/native-reference/**
            build/security/provenance-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload packaged acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demonx-circuit-packaged-acceptance
          path: ${{ runner.temp }}/desktop-acceptance/
          if-no-files-found: warn
          retention-days: 30
