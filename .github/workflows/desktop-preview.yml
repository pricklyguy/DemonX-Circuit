name: DemonX Circuit Windows desktop preview

on:
  push:
    branches: [codex/demonx-circuit-foundation]
    paths:
      - ".github/workflows/desktop-preview.yml"
      - "desktop/**"
      - "desktop/assets/**"
      - "package.json"
      - "package-lock.json"
      - "prototype/generate-esphome.mjs"
      - "examples/esp32-sensor/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-preview:
    runs-on: windows-2022
    steps:
      - name: Check out approved feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked project-local dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure pinned Electron runtime is present locally
        run: node node_modules/electron/install.js

      - name: Compile TypeScript renderer and preload
        run: npm run build

      - name: Download the latest verified native fixture output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kicad-native-smoke-10.0.7
          path: build/native-fixture
          repository: ${{ github.repository }}
          run-id: 40062064377
          github-token: ${{ github.token }}

      - name: Assemble portable Windows preview folder
        shell: pwsh
        run: |
          $bundle = Join-Path (Get-Location).Path "build/windows-preview/DemonX-Circuit"
          $appRoot = Join-Path $bundle "resources/app"
          New-Item -ItemType Directory -Force $appRoot | Out-Null
          Copy-Item "node_modules/electron/dist/*" $bundle -Recurse -Force
          Copy-Item "node_modules/electron/dist/electron.exe" (Join-Path $bundle "DemonX Circuit.exe") -Force
          Copy-Item package.json $appRoot -Force
          New-Item -ItemType Directory -Force "$appRoot/desktop/dist" | Out-Null
          New-Item -ItemType Directory -Force "$appRoot/desktop" | Out-Null
          Copy-Item desktop/main.cjs "$appRoot/desktop/main.cjs" -Force
          Copy-Item desktop/index.html,desktop/style.css "$appRoot/desktop/" -Force
          Copy-Item desktop/dist/* "$appRoot/desktop/dist/" -Recurse -Force
          Copy-Item desktop/assets "$appRoot/desktop/assets" -Recurse -Force
          Copy-Item prototype "$appRoot/prototype" -Recurse -Force
          Copy-Item examples "$appRoot/examples" -Recurse -Force
          $nativeFixture = Join-Path (Get-Location).Path "build/native-fixture/examples/esp32-sensor/native"
          if (-not (Test-Path (Join-Path $nativeFixture "DX_ESP32_Sensor.kicad_pcb"))) { throw "Verified native fixture is missing from the downloaded KiCad artifact: $nativeFixture" }
          New-Item -ItemType Directory -Force "$appRoot/examples/esp32-sensor/native" | Out-Null
          Copy-Item "$nativeFixture/*" "$appRoot/examples/esp32-sensor/native/" -Recurse -Force
          @'
          DemonX Circuit Preview 0.4.0

          Launch with "DemonX Circuit.exe". This portable preview does not install software or modify PATH/registry.
          KiCad 10.0.7 must be installed separately for native schematic, PCB, ERC/DRC, and manufacturing operations.
          ESPHome CLI must be installed separately to validate the generated YAML. This preview does not deploy firmware.
          AI/MCP, Forge, and CNC handoffs are not implemented in this preview.
          '@ | Set-Content "$bundle/README.txt"
          Compress-Archive -Path "$bundle/*" -DestinationPath build/DemonX-Circuit-Windows-Preview-0.4.0.zip -Force

      - name: Run packaged Windows acceptance test against extracted ZIP
        shell: pwsh
        run: |
          $extracted = Join-Path (Get-Location).Path "build/windows-e2e"
          Expand-Archive -Path "build/DemonX-Circuit-Windows-Preview-0.4.0.zip" -DestinationPath $extracted -Force
          $exeCandidates = @(Get-ChildItem -LiteralPath $extracted -Filter "DemonX Circuit.exe" -File -Recurse)
          if ($exeCandidates.Count -ne 1) { throw "Expected one packaged executable, found $($exeCandidates.Count)." }
          $appExe = $exeCandidates[0].FullName
          Write-Output "PackagedExecutable=$appExe"
          & node desktop/acceptance.mjs "$appExe" (Join-Path $env:RUNNER_TEMP "desktop-acceptance")

      - name: Upload Windows preview and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demonx-circuit-windows-preview-0.4.0
          path: |
            build/DemonX-Circuit-Windows-Preview-0.4.0.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload packaged acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demonx-circuit-packaged-acceptance
          path: ${{ runner.temp }}/desktop-acceptance/
          if-no-files-found: warn
          retention-days: 30
